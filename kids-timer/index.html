<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kids Timer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <h1 class="app__title">Kids Timer</h1>

    <div class="mode-toggle" role="tablist" aria-label="Timer mode">
      <button id="modeSingleBtn" class="mode-toggle__btn is-active" type="button">Single Timer</button>
      <button id="modeRoutineBtn" class="mode-toggle__btn" type="button">Routine</button>
    </div>

    <section class="timer">
      <svg class="ring" viewBox="0 0 200 200">
        <circle class="ring__track" cx="100" cy="100" r="90" />
        <circle class="ring__progress" cx="100" cy="100" r="90" />
      </svg>
      <div class="timer__display">
        <span id="actionNameText" class="timer__action"></span>
        <span id="timeText" class="timer__time">00:00</span>
        <span id="stepIndicatorText" class="timer__step"></span>
        <span id="statusText" class="timer__status"></span>
      </div>
    </section>

    <div id="singleTimerView">
      <section class="presets" aria-label="Preset durations">
        <button class="preset-btn" data-seconds="60">1 min</button>
        <button class="preset-btn" data-seconds="300">5 min</button>
        <button class="preset-btn" data-seconds="600">10 min</button>
        <button class="preset-btn" data-seconds="900">15 min</button>
        <button class="preset-btn" data-seconds="1200">20 min</button>
      </section>

      <section class="custom" aria-label="Custom duration">
        <label class="custom__field">
          <span>Minutes</span>
          <input type="number" id="minutesInput" min="0" max="99" value="0" />
        </label>
        <label class="custom__field">
          <span>Seconds</span>
          <input type="number" id="secondsInput" min="0" max="59" value="0" />
        </label>
        <button id="customStartBtn" class="custom__start-btn">Set & Start</button>
      </section>
    </div>

    <section id="routineView" class="routine" aria-label="Routine builder" hidden>
      <div id="routineBuilder" class="routine-builder">
        <section id="savedRoutinesSection" class="saved-routines" hidden>
          <h2 class="saved-routines__title">Saved Routines</h2>
          <ul id="savedRoutinesList" class="saved-routines-list"></ul>
        </section>

        <div class="quick-add" aria-label="Quick add actions">
          <button type="button" class="preset-btn quick-add-btn" data-name="Get dressed" data-seconds="300">Get dressed</button>
          <button type="button" class="preset-btn quick-add-btn" data-name="Brush teeth" data-seconds="120">Brush teeth</button>
          <button type="button" class="preset-btn quick-add-btn" data-name="Eat breakfast" data-seconds="900">Eat breakfast</button>
          <button type="button" class="preset-btn quick-add-btn" data-name="Pack bag" data-seconds="180">Pack bag</button>
          <button type="button" class="preset-btn quick-add-btn" data-name="Put on shoes" data-seconds="60">Put on shoes</button>
          <span id="savedActionChips" class="saved-action-chips"></span>
        </div>

        <div class="custom action-add" aria-label="Add custom action">
          <label class="custom__field action-add__name">
            <span>Action</span>
            <input type="text" id="actionNameInput" placeholder="e.g. Feed the cat" maxlength="40" />
          </label>
          <label class="custom__field">
            <span>Minutes</span>
            <input type="number" id="actionMinutesInput" min="0" max="99" value="0" />
          </label>
          <label class="custom__field">
            <span>Seconds</span>
            <input type="number" id="actionSecondsInput" min="0" max="59" value="0" />
          </label>
          <button id="addActionBtn" class="custom__start-btn" type="button">Add</button>
        </div>

        <ul id="actionList" class="action-list"></ul>

        <div class="routine-actions">
          <button id="saveRoutineBtn" class="control-btn save-routine-btn" type="button" disabled>Save Routine</button>
          <button id="startRoutineBtn" class="control-btn start-routine-btn" type="button" disabled>Start Routine</button>
        </div>
      </div>

      <ol id="routineProgress" class="routine-progress" hidden></ol>
    </section>

    <section class="controls">
      <button id="pauseResumeBtn" class="control-btn" disabled>Pause</button>
      <button id="resetBtn" class="control-btn" disabled>Reset</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
